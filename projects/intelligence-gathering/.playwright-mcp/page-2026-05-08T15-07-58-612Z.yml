    - generic [ref=e96]:
      - heading "Estudios de Producción y Postproducción Audiovisual" [level=1] [ref=e97]
      - generic [ref=e98]:
        - paragraph [ref=e99]: Estudia producción y postproducción audiovisual con una formación pensada para ayudarte a crear antes, dominar herramientas antes y convertir tu interés por el vídeo, los VFX y el motion graphics en resultados visibles desde el inicio. En CEI puedes elegir entre cursos, másteres y títulos superiores con una metodología práctica orientada a que cada aprendizaje tenga una aplicación real en proyectos audiovisuales.
        - paragraph [ref=e100]: Esta área está dirigida a quienes quieren especializarse, actualizar su perfil creativo o dar un salto profesional en un sector donde la técnica, la agilidad y la capacidad de ejecución marcan la diferencia. Cuando el aprendizaje se traduce en piezas, procesos y portfolio, la decisión cuesta menos y el avance se percibe mucho antes.
        - paragraph [ref=e101]: Fórmate online o presencialmente en un entorno que integra edición de vídeo, composición, motion graphics, 3D, corrección de color y producción audiovisual para que cada paso de tu formación sume valor real a tu perfil y a tu proyección profesional.
