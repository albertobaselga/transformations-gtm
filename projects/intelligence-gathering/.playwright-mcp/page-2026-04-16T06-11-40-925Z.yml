                  - heading "Descripción completa del empleo" [level=2] [ref=e1048]
                  - generic [ref=e1049]:
                    - generic [ref=e1050]:
                      - paragraph [ref=e1051]: At Treatwell, we believe self-care should be effortless – and we’re on a mission to make booking beauty and wellness treatments as easy as ordering your morning flat white.
                      - paragraph [ref=e1052]: Now, we’re building something new. A next-gen in-house design and creative studio. A fresh take on the Treatwell brand. 15 markets. New channels. Big campaigns. Bold experiments. And we’re looking for a Motion Designer who gets it. Someone who knows that motion isn’t just a nice-to-have; it’s the glue, the spark, the emotional hook.
                      - paragraph [ref=e1053]: You’ll be the one who makes our ideas move – literally. From snappy Reels to slick product explainers, dynamic ads to kinetic typography that gives you chills – this is a role for someone who eats keyframes for breakfast and dreams in storyboards.
                      - text: "You will be responsible for:"
                      - list [ref=e1054]:
                        - listitem [ref=e1055]: "Making things move with meaning: You’ll bring our brand to life in motion across paid, organic, web, app, and product. Emotional? Yep. Effective? Always."
                        - listitem [ref=e1056]: "Creating from scratch: From concept to final render, you’re hands-on: storyboarding, animating, editing, sound designing; whatever it takes to make it sing."
                        - listitem [ref=e1057]: "Designing for scroll: You get what cuts through on TikTok, Insta, YouTube Shorts and beyond. You’ll make content that stops thumbs and starts conversations."
                        - listitem [ref=e1058]: "Pairing beauty with performance: Whether it’s an ad with serious CTR or a brand film with staying power, you’re dialled into what works and why."
                        - listitem [ref=e1059]: "Designing for 15 markets: You’ll help us build a motion system that scales, flexes, and feels local without losing its edge."
                        - listitem [ref=e1060]: "Moving fast and experimenting often: You love a rapid turnaround and a tight feedback loop. Test. Learn. Repeat. Let’s go."
                      - text: "About you:"
                      - list [ref=e1061]:
                        - listitem [ref=e1062]: A motion obsessive with 2+years of experience and a killer portfolio or showreel.
                        - listitem [ref=e1063]: Strong storytelling instincts, design taste, and a love for rhythm, timing, and flow.
                        - listitem [ref=e1064]: After Effects pro - bonus if you dabble in 3D, editing, or sound design.
                        - listitem [ref=e1065]: Experience designing for performance channels, social-first content, web, and product.
                        - listitem [ref=e1066]: An eye for trends, a nose for nuance, and a gut feel for what moves people.
                        - listitem [ref=e1067]: A collaborator who’s confident presenting ideas, taking feedback, and elevating the work around you.
                        - listitem [ref=e1068]: Someone who thrives in a fast-paced, high-growth environment and wants to help shape a brand from the inside out.
                        - listitem [ref=e1069]: "Showreel or portfolio required: we want to see motion that moves people. From slick transitions to bold typography, lo-fi edits to polished animations, show us how you bring stories to life through pace, energy, and design. Whether it’s paid ads, social content, or brand films, we’re looking for work that’s smart, scroll-stopping, and made for motion."
                      - text: About Treatwell
                      - paragraph [ref=e1070]: Hi, we’re Treatwell. Nice to meet you.
                      - paragraph [ref=e1071]: We’re a team of 700 passionate and brilliantly talented people across Europe. We’re the industry’s smartest salon management software, all connected to Europe’s leading bookings platform, working with over 50,000 salon partners across 13 countries, processing over 8 million bookings every month. And….breathe.
                      - paragraph [ref=e1072]: But we’re not done yet. We’re on an exciting journey to digitally revolutionise the hair and beauty community.
                      - paragraph [ref=e1073]: If this excites you, we might just have the role for you.
                      - text: "We’ll treat you with:"
                      - list [ref=e1074]:
                        - listitem [ref=e1075]: 28-days holiday, plus bank holidays
                        - listitem [ref=e1076]: Monthly €40 Treatwell vouchers so you can treat yourself too
                        - listitem [ref=e1077]: Mental health support through our partnership with Plumm
                        - listitem [ref=e1078]: Growth funds for you to develop and grow with your team
                      - text: Equal Ops
                      - paragraph [ref=e1079]: We are committed to fostering a diverse, inclusive, and equitable workplace and are proud to be an equal opportunity employer. All qualified applicants will receive consideration without regard to their condition.
