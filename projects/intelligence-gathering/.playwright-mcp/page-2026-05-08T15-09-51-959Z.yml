              - generic [ref=e85]: DESCRIPCIÓN DEL MÁSTER
            - heading "El máster sumerge al alumnado en la posproducción audiovisual como un proceso profesional integral, en el que se conectan de forma transversal todas las etapas que intervienen desde el final del rodaje hasta la entrega y explotación de la obra audiovisual." [level=3] [ref=e86]:
              - generic [ref=e87]: El máster sumerge al alumnado en la posproducción audiovisual como un proceso profesional integral, en el que se conectan de forma transversal todas las etapas que intervienen desde el final del rodaje hasta la entrega y explotación de la obra audiovisual.
          - generic [ref=e88]:
            - generic [ref=e93]:
              - paragraph [ref=e94]: Este máster está diseñado para que el alumnado se sumerga en la posproducción como un proceso completo, transversal y profesional, integrando todas las etapas que intervienen desde el final del rodaje hasta la entrega y explotación de una obra audiovisual.
              - paragraph [ref=e95]: Desde una visión integral de la posproducción, el alumnado aprenderá a trabajar con material procedente de producciones reales, y participará en un proyecto transversal, en el que aprenderá a hablar el mismo idioma que los departamentos implicado en posproducción manejan, adquiriendo así una visión global de todo el proceso.
              - paragraph [ref=e96]: La inteligencia artificial se aborda de forma transversal en cada módulo, analizando su impacto real en los flujos de trabajo actuales y futuros, siempre desde una perspectiva técnica, creativa y profesional.
