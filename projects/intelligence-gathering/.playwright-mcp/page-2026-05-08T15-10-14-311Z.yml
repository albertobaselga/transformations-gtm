                    - paragraph [ref=e87]:
                      - text: En la industria audiovisual, la innovación tecnológica marca la diferencia entre un flujo de trabajo eficiente y uno lento y costoso
                      - strong [ref=e88]: . La aplicación de la inteligencia artificial en la producción audiovisual
                      - text: se ha convertido en una herramienta transformadora para la edición, la corrección de color, la composición y la postproducción en general.
                    - paragraph [ref=e89]:
                      - text: Nuestro Diploma de Experto ofrece una formación avanzada y orientada a la práctica para i
                      - strong [ref=e90]: ntegrar la IA en el flujo de trabajo profesional,
                      - text: automatizar procesos y optimizar la producción audiovisual. A lo largo de 150 horas de formación online en directo, combinando sesiones teóricas y práctica guiada, aprenderás a aplicar la IA en tareas de edición, composición, limpieza y mejora de audio, generación de contenidos y asistencia creativa. Trabajaremos con
                      - strong [ref=e91]: DaVinci Resolve
                      - text: y otras herramientas profesionales de
                      - strong [ref=e92]: Adobe Creative Cloud
