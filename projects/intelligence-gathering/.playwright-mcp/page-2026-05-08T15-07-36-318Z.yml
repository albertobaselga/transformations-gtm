                    - listitem [ref=e83]: Integrar la IA Generativa en entornos web, instalaciones interactivas y multimedia.
                    - listitem [ref=e84]: Diseñar y gestionar flujos de trabajo multimodales.
                    - listitem [ref=e85]: Ofrecer una visión integral de la profesionalización de la IA en proyectos creativos, incluyendo aspectos legales, éticos y sociales.
