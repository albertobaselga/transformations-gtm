              - generic [ref=e53]:
                - heading "Presentación" [level=3] [ref=e56]: Presentación
                - generic [ref=e60]:
                  - 'heading "Posgrado en Producción Audiovisual con Inteligencia Artificial: creación de contenidos con herramientas de IA generativa" [level=2] [ref=e61]'
                  - paragraph [ref=e62]: La Inteligencia Artificial ha transformado la forma de generar contenidos audiovisuales, dando lugar a nuevas formas de narración y visualización. Tanto es el potencial que tienen las herramientas de IA que los profesionales del diseño y la creatividad se están viendo obligados a, no solo incorporarlas en sus proyectos, sino a dominarlas para sacarles el máximo partido.
                  - paragraph [ref=e63]:
                    - text: El
                    - strong [ref=e64]: Posgrado en Producción Audiovisual con Inteligencia Artificial
                    - text: está pensado para enseñarte a transformar textos e imágenes en secuencias de vídeo, producir piezas musicales y crear proyectos multimedia e interactivos mediante el uso y la combinación de herramientas de IA tales como Pika Labs, Luma AI, Stable diffusion, elevenlabs o Touchdesigners.
                  - paragraph [ref=e65]: Además, también aprenderás a combinar los resultados obtenidos con IA con otros softwares y herramientas especializadas en postproducción, para orquestar flujos de trabajo multimodales que combinen diferentes disciplinas y se adapten a diferentes formatos.
                  - paragraph [ref=e66]: De igual forma, este posgrado te brinda una comprensión sobre el impacto social de la IA, así como los límites legales y los dilemas éticos que presenta la incorporación de estas herramientas en proyectos creativos.
                  - paragraph [ref=e67]:
                    - img "interactividad ia" [ref=e68]
