    - article [ref=e166]:
      - heading "Revisiones y actualización de datos" [level=2] [ref=e167]
      - generic [ref=e169]:
        - paragraph [ref=e170]:
          - text: A partir de este primer trimestre de 2026 la EPA ha empezado a codificar la actividad económica con la nueva Clasificación de Actividades CNAE-2025, de acuerdo con el
          - link "Enlace a Reglamento" [ref=e171] [cursor=pointer]:
            - /url: https://eur-lex.europa.eu/legal-content/ES/TXT/PDF/?uri=CELEX:32023R0137
            - text: Reglamento Delegado (UE) 2023/137 de la Comisión
          - text: .
        - paragraph [ref=e172]: No obstante, durante los cuatro trimestres de este año se realizará una doble codificación de la actividad, incorporando tanto el código de la CNAE-2025 como el de la CNAE-2009, utilizada hasta el cuarto trimestre de 2025. Esto permitirá comparar los resultados con los trimestres anteriores y disponer de un año completo de enlace entre ambas clasificaciones.
        - paragraph [ref=e173]:
          - text: Con esta doble codificación en
          - link "Enlace a INEbase" [ref=e174] [cursor=pointer]:
            - /url: https://www.ine.es/dyngs/INEbase/operacion.htm?c=Estadistica_C&cid=1254736176918&menu=resultados&idp=1254735976595
            - text: INEbase
          - text: se publicarán resultados obtenidos con ambas clasificaciones para los cuatro trimestres de 2026 -los de CNAE 2025 en el sitio habitual y los de CNAE 2009 en el subapartado de
          - emphasis [ref=e175]: Resultados con clasificaciones o metodologías no vigentes-
          - text: .
        - paragraph [ref=e176]: En las notas de prensa de la EPA referidas a 2026 la información por sectores económicos utilizará la clasificación antigua en todos los trimestres, para mantener la comparabilidad con el trimestre previo y el mismo de 2025.
        - paragraph [ref=e177]: Por su parte, en las notas de prensa referidas al primer trimestre de 2027 y a trimestres posteriores las comparaciones en los datos por sectores se realizarán utilizando la nueva CNAE 2025.
        - paragraph [ref=e178]:
          - text: Los datos publicados hoy son definitivos. Todos los resultados de esta operación están disponibles en
          - link "Enlace a INEbase" [ref=e179] [cursor=pointer]:
            - /url: /dyngs/INEbase/es/operacion.htm?c=Estadistica_C&cid=1254736176918&menu=resultados&idp=1254735976595
            - text: INEbase
          - text: .
    - article [ref=e180]:
      - heading "Nota sobre la utilización de la nueva CNAE 2025 en la codificación de la EPA" [level=2] [ref=e181]
      - generic [ref=e183]:
        - paragraph [ref=e184]: La adaptación a la nueva clasificación de actividades económicas de la Unión Europea ha provocado una nueva codificación de las variables de la EPA relativas a la rama de actividad a partir del primer trimestre de 2026.
        - paragraph [ref=e185]: "Las variables objeto de esta nueva codificación son las siguientes:"
        - list [ref=e186]:
          - listitem [ref=e187]: Actividad del empleo principal de las personas ocupadas
          - listitem [ref=e188]: Actividad del segundo empleo (ocupados con más de un empleo)
          - listitem [ref=e189]: Actividad en el último empleo (parados e inactivos que han dejado su último empleo hace menos de un año)
        - paragraph [ref=e190]: La transición de CNAE-2009 a CNAE-2025 implica una redistribución de algunas ramas de actividad entre los grandes sectores económicos. Así, actividades que antes se clasificaban íntegramente dentro de un sector pasan a dividirse entre varios.
        - paragraph [ref=e191]:
          - text: Por ejemplo, la rama
          - emphasis [ref=e192]: Reparación e instalación de maquinaria y equipo
          - text: ", que en la CNAE-2009 se adscribía al sector de la"
          - emphasis [ref=e193]: Industria
          - text: ", se reparte en la CNAE-2025 entre la"
          - emphasis [ref=e194]: Industria
          - text: ", la"
          - emphasis [ref=e195]: Agricultura
          - text: y los
          - emphasis [ref=e196]: Servicios
          - text: .
        - paragraph [ref=e197]:
          - text: De forma similar, las ramas
          - emphasis [ref=e198]: Construcción de edificios
          - text: ","
          - emphasis [ref=e199]: Ingeniería civil
          - text: "y"
          - emphasis [ref=e200]: Actividades de construcción especializada
          - text: dejan de pertenecer exclusivamente al sector de la
          - emphasis [ref=e201]: Construcción
          - text: y pasan a distribuirse parcialmente entre este sector y el de los
          - emphasis [ref=e202]: Servicios
          - text: .
        - paragraph [ref=e203]:
          - text: Y determinadas ramas de
          - emphasis [ref=e204]: Servicios
          - text: ", como"
          - emphasis [ref=e205]: Almacenamiento y actividades anexas al transporte
          - text: ","
          - emphasis [ref=e206]: Otras actividades profesionales, científicas y técnicas
          - text: "y"
          - emphasis [ref=e207]: Actividades administrativas de oficina y otros servicios auxiliares a las empresas
          - text: ", incorporan ahora componentes que se asignan a los sectores de la"
          - emphasis [ref=e208]: Industria
          - text: y de la
          - emphasis [ref=e209]: Construcción
          - text: .
        - paragraph [ref=e210]:
          - text: En la página web del INE figura la información completa sobre
          - link "Enlace todos los cambios que provoca la nueva codificación de ramas de actividad" [ref=e211] [cursor=pointer]:
            - /url: https://www.ine.es/dyngs/INEbase/es/operacion.htm?c=Estadistica_C&cid=1254736177032&menu=ultiDatos&idp=1254735976614
            - text: todos los cambios que provoca la nueva codificación de ramas de actividad
          - text: .
    - article [ref=e212]:
      - heading "Nota metodológica" [level=2] [ref=e213]
      - generic [ref=e215]:
        - paragraph [ref=e216]: La Encuesta de Población Activa (EPA) se realiza desde 1964. Su metodología vigente -de 2021- adapta la anterior a la nueva normativa de la Encuesta Europea de Fuerza de Trabajo.
        - paragraph [ref=e217]: Se trata de una investigación continua y de periodicidad trimestral dirigida a las familias, cuya finalidad principal es obtener datos de la fuerza de trabajo y de sus diversas categorías (ocupados, parados), así como de la población ajena al mercado laboral (inactivos).
        - paragraph [ref=e218]: A partir del tercer trimestre de 2025 y resuelto el convenio suscrito con el Instituto Galego de Estatística (IGE) una vez transcurrido el plazo de vigencia, desaparece de la EPA la muestra adicional de Galicia integrada en la encuesta desde el tercer trimestre de 2009.
        - generic [ref=e219]:
          - term [ref=e220]: "Tipo de operación:"
          - definition [ref=e221]: continua de periodicidad trimestral.
          - term [ref=e222]: "Ámbito poblacional:"
          - definition [ref=e223]: población que reside en viviendas familiares.
          - term [ref=e224]: "Ámbito geográfico:"
          - definition [ref=e225]: todo el territorio nacional.
          - term [ref=e226]: "Periodo de referencia de los resultados:"
          - definition [ref=e227]: el trimestre.
          - term [ref=e228]: "Periodo de referencia de la información:"
          - definition [ref=e229]: la semana anterior a la entrevista.
          - term [ref=e230]: "Tamaño muestral:"
          - definition [ref=e231]: El número de secciones censales es de 5.010. El promedio de viviendas seleccionadas por sección pasará de 14 a 15 y el aumento se realizará de manera paulatina, con las correspondientes renovaciones de cada sexta parte de la muestra, desde el primer trimestre de 2026 hasta el segundo de 2027. Desde el tercer trimestre de 2025 hay alrededor de 46.000 viviendas y 110.000 personas de muestra efectiva.
          - term [ref=e232]: "Tipo de muestreo:"
          - definition [ref=e233]: bietápico con estratificación en las unidades de primera etapa, que son las secciones censales. Las unidades de segunda etapa son viviendas familiares habitadas.
          - term [ref=e234]: "Método de recogida:"
          - definition [ref=e235]: entrevista personal, telefónica y vía web.
        - paragraph [ref=e236]:
          - text: Para más información se puede tener acceso a la
          - link "Enlace a la metodología de la Encuesta de Población Activa" [ref=e237] [cursor=pointer]:
            - /url: /inebaseDYN/epa30308/docs/resumetepa21.pdf
