    - article [ref=e75]:
      - generic [ref=e76]:
        - paragraph [ref=e78]: El número de ocupados disminuyó en 170.300 personas en el primer trimestre de 2026 y se situó en 22.293.000. La tasa de variación trimestral fue del -0,76%.
        - generic [ref=e79]:
          - text: Variación de la ocupación en el primer trimestre respecto al cuarto del año anterior
          - paragraph [ref=e82]: Miles de personas
        - generic [ref=e83]:
          - paragraph [ref=e84]: Por sexo, el empleo se redujo este trimestre en 80.100 hombres y en 90.200 mujeres. Por nacionalidad, bajó en 111.300 entre los españoles -incluye doble nacionalidad- y en 59.000 entre los extranjeros.
          - paragraph [ref=e85]:
            - text: Por sectores, la ocupación aumentó en la
            - emphasis [ref=e86]: Industria
            - text: (28.100 más), la
            - emphasis [ref=e87]: Construcción
            - text: (17.500) y la
            - emphasis [ref=e88]: Agricultura
            - text: (12.500). Y bajó en los
            - emphasis [ref=e89]: Servicios
            - text: (228.400 menos). Estas diferencias se han calculado de acuerdo con la clasificación CNAE 2009 (ver apartado Revisiones y actualización de datos).
          - paragraph [ref=e90]: El empleo a tiempo completo disminuyó en 116.500 personas y el de tiempo parcial en 53.800. Por su parte, el número de asalariados bajó en 102.900 -los que tenían contrato indefinido se redujeron en 17.600 y los de contrato temporal en 85.400-. El número de trabajadores por cuenta propia descendió en 68.600 personas.
          - paragraph [ref=e91]: El empleo privado bajó este trimestre en 191.400 personas, hasta 18.630.500, mientras que el empleo público aumentó en 21.100, hasta 3.662.500.
          - paragraph [ref=e92]:
            - text: En los 12 últimos meses el empleo aumentó en 527.600 personas (un 2,42%), con incrementos de 313.200 hombres y 214.400 mujeres. Por sectores, el mayor crecimiento se dio en los
            - emphasis [ref=e93]: Servicios
            - text: (253.800 ocupados más) -esta diferencia se ha calculado de acuerdo con la clasificación CNAE 2009 (ver apartado Revisiones y actualización de datos)-.
          - paragraph [ref=e94]: El empleo a tiempo completo subió en 567.600 personas en los 12 últimos meses, mientras que el empleo a tiempo parcial disminuyó en 40.000. Por su parte, el empleo asalariado indefinido aumentó en 539.700 personas y el temporal en 17.200.
    - article [ref=e95]:
      - heading "Desempleo y tasa de paro" [level=2] [ref=e96]
      - generic [ref=e97]:
        - paragraph [ref=e99]: El número de parados subió este trimestre en 231.500 personas, hasta 2.708.600. La variación trimestral del desempleo fue del 9,34%.
        - generic [ref=e100]:
          - text: Variación del paro en el primer trimestre respecto al cuarto del año anterior
          - paragraph [ref=e103]: Miles de personas
        - generic [ref=e104]:
          - paragraph [ref=e105]: La tasa de paro aumentó 90 centésimas y se situó en el 10,83%.
          - paragraph [ref=e106]: Por sexo, el número de hombres en paro creció en 94.500 este trimestre y el de mujeres en 137.000. La tasa de paro femenina subió 1,11 puntos -hasta el 12,35%- y la masculina en 71 centésimas -hasta el 9,47%-.
          - paragraph [ref=e107]: Por nacionalidad, el paro se incrementó entre los españoles -incluye doble nacionalidad- en 106.700 y entre los extranjeros en 124.800.
          - paragraph [ref=e108]:
            - text: El desempleo subió este trimestre en los
            - emphasis [ref=e109]: Servicios
            - text: (162.100 más), la
            - emphasis [ref=e110]: Industria
            - text: (13.000) y la
            - emphasis [ref=e111]: Agricultura
            - text: (9.500). Y disminuyó en la
            - emphasis [ref=e112]: Construcción
            - text: (11.700 menos). Estas diferencias se han calculado de acuerdo con la CNAE 2009 (ver apartado Revisiones y actualización de datos).
          - paragraph [ref=e113]: El paro aumentó en 39.500 entre los que perdieron su empleo hace más de un año y en 19.200 entre las personas que buscan su primer empleo.
          - paragraph [ref=e114]: En los 12 últimos meses la cifra total de desempleados se redujo en 80.600 personas (62.200 hombres y 18.400 mujeres menos). La variación anual fue del -2,89%.
          - paragraph [ref=e115]:
            - text: Por sectores, el desempleo disminuyó en el último año en la
            - emphasis [ref=e116]: Construcción
            - text: (22.700 menos), los
            - emphasis [ref=e117]: Servicios
            - text: (-6.000) y la
            - emphasis [ref=e118]: Industria
            - text: (-3.900), y casi no varió en la
            - emphasis [ref=e119]: Agricultura
            - text: (300). Estas diferencias se han calculado de acuerdo con la clasificación CNAE 2009 (ver apartado Revisiones y actualización de datos).
          - paragraph [ref=e120]: Por su parte, el número de parados que ha perdido su empleo hace más de un año bajó en 42.000 y el de parados que buscan su primer empleo en 6.100.
    - article [ref=e121]:
      - heading "Población activa y tasa de actividad" [level=2] [ref=e122]
      - generic [ref=e124]:
        - paragraph [ref=e125]: La población activa creció en 61.200 personas en el primer trimestre de 2026 y se situó en 25.001.600. El número de mujeres activas se incrementó en 46.700 y el de hombres en 14.400.
        - paragraph [ref=e126]: Por nacionalidad, el número de activos disminuyó en el último trimestre en 4.600 entre los españoles, mientras que aumentó en 65.800 entre los extranjeros.
        - paragraph [ref=e127]: La tasa de actividad bajó ocho centésimas, hasta el 58,86%. La de los españoles descendió también ocho centésimas, hasta el 57,21% y la de los extranjeros se redujo 25 centésimas, hasta el 68,49%. La diferencia entre ambas se debe, fundamentalmente, a la diferente estructura por edades.
        - paragraph [ref=e128]: En términos anuales, la población activa aumentó en 447.000 personas. La tasa de variación anual fue del 1,82%.
    - article [ref=e129]:
      - heading "Hogares" [level=2] [ref=e130]
      - generic [ref=e132]:
        - paragraph [ref=e133]: Los hogares con todos sus miembros activos en paro se incrementaron en 78.500 este trimestre, hasta 850.700. Por su parte, los que tenían a todos sus miembros activos ocupados disminuyeron en 121.300 y se situaron en 12.045.000.
        - paragraph [ref=e134]: En los 12 últimos meses el número de hogares con al menos un activo en los que todos los activos están en paro se redujo en 32.200, mientras que los que tienen a todos sus activos ocupados aumentó en 263.200.
    - article [ref=e135]:
      - heading "Resultados por comunidades autónomas y datos provinciales" [level=2] [ref=e136]
      - generic [ref=e138]:
        - paragraph [ref=e139]: El mayor incremento de empleo este trimestre se dio en Canarias (17.000 más). Y el mayor descenso en Cataluña (-46.300).
        - paragraph [ref=e140]: En términos relativos, el mayor aumento también se dio en Canarias (1,63%) -las cifras de empleo se presentan, como el resto de los datos EPA, en función de la comunidad autónoma de residencia de los entrevistados, no en función de la ubicación del centro de trabajo-.
        - paragraph [ref=e141]: En cuanto al paro, la mayor bajada se registró en Canarias (-14.400). Y el mayor incremento en Cataluña (84.400 más).
        - paragraph [ref=e142]: Cantabria (7,49%) registró la tasa de paro más baja este trimestre. Andalucía (14,66%), la más elevada.
        - paragraph [ref=e143]:
          - text: A nivel provincial, se puede acceder a un resumen de resultados en este
          - link "Enlace al resumen provincial" [ref=e144] [cursor=pointer]:
            - /url: /prensa/anexo_tablas/es/EPA1T26_PRO.xlsx
            - text: documento
          - text: y a toda la información disponible desde este
          - link "Enlace a los resultados provinciales" [ref=e145] [cursor=pointer]:
