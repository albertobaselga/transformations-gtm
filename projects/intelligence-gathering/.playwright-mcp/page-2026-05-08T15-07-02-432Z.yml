              - generic [ref=e53]:
                - heading "Presentación" [level=3] [ref=e56]: Presentación
                - generic [ref=e60]:
                  - 'heading "Máster en Inteligencia Artificial Generativa para creativos: creación de contenidos audiovisuales con IA" [level=2] [ref=e61]'
                  - paragraph [ref=e62]:
                    - text: La Inteligencia Artificial ha evolucionado de manera sorprendente en los últimos años, generando nuevas oportunidades laborales que requieren de profesionales capaces de dominar estas herramientas. Sin embargo, no todo versa en saber utilizar herramientas de
                    - strong [ref=e63]: IA Generativa
                    - text: como Stable Diffusion, Midjourney, DALL.E, ChatGPT, Luma AI o Comfy UI, sino que el verdadero reto está en comprender a fondo su funcionamiento para aprovechar todo su potencial creativo y desarrollar proyectos de alto nivel.
                  - paragraph [ref=e64]:
                    - text: El
                    - strong [ref=e65]: Máster en IA Generativa
                    - text: te permitirá dominar la creación de contenidos audiovisuales -imágenes, vídeos y piezas musicales- a través del uso y la combinación de diferentes herramientas de
                    - strong [ref=e66]: IA Generativa
                    - text: . Para ello, aprenderás a generar y encadenar prompts técnicos que incluyan referencias históricas, cinematográficas y culturales, que te permitirán construir el proyecto de forma progresiva y coherente.
                  - paragraph [ref=e67]:
                    - img "ia" [ref=e68]
                  - paragraph [ref=e69]: Además, en el Máster también verás cómo emplear otras herramientas de postproducción avanzada para ajustar y retocar los contenidos generados con IA y obtener así un resultado profesional de calidad listo para ser exhibido y/o distribuido. Todo ello, con un enfoque integral que abarca desde la coherencia estética y narrativa, hasta los aspectos técnicos, éticos y de responsabilidad social del uso de la Inteligencia Artificial en los proyectos creativos.
                  - paragraph [ref=e70]:
                    - text: Esta
                    - strong [ref=e71]: formación en Inteligencia Artificial
                    - text: está diseñada para ofrecerte un aprendizaje práctico y especializado, permitiéndote desarrollar las habilidades necesarias para destacar en el sector creativo.
              - generic [ref=e73]:
                - heading "Objetivos" [level=3] [ref=e76]: Objetivos
                - generic [ref=e80]:
                  - paragraph [ref=e81]: "Los objetivos del Máster en Inteligencia Artificial Generativa para creativos son:"
                  - list [ref=e83]:
                    - listitem [ref=e84]: Comprender los fundamentos técnicos y conceptuales de la IA Generativa.
                    - listitem [ref=e85]: Analizar el impacto de los datos y los sesgos en el uso profesional de la IA.
                    - listitem [ref=e86]: Dominar el prompt engineering para obtener resultados audiovisuales precisos y creativos.
                    - listitem [ref=e87]: Enriquecer la creación visual con IA a través de referencias históricas, cinematográficas y culturales.
                    - listitem [ref=e88]: Aplicar postproducción digital en imágenes, vídeos, animaciones y música generada con IA.
                    - listitem [ref=e89]: Integrar la IA Generativa en proyectos audiovisuales, multimedia e interactivos.
                    - listitem [ref=e90]: Conocer los aspectos legales, éticos y de responsabilidad social del uso de la IA.
