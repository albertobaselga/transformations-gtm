        - generic [ref=e47]:
          - paragraph [ref=e48]: La escuela
          - paragraph [ref=e49]: Conócenos
        - generic [ref=e50]:
          - heading "La escuela líder del sector en España" [level=3] [ref=e51]
          - paragraph [ref=e52]: Somos el centro de formación del sector con mayor número de estudiantes de España, pasando por nuestras aulas aproximadamente 4.000 alumnos cada año, apasionados por el mundo del diseño, el marketing y las tecnologías emergentes. Ser la opción más elegida del país, junto a nuestra trayectoria de más de 30 años como escuela, es la máxima garantía de calidad que podemos ofrecer a cualquier interesado en estudiar en CEI.
          - paragraph [ref=e53]: Logros
          - paragraph [ref=e54]:
            - text: Contar con los siguientes logros es una garantía indiscutible para nuestros alumnos (
            - link "datos públicos de la plataforma Emagister, año 2024" [ref=e55] [cursor=pointer]:
              - /url: https://www.emagister.com/cei-escuela-diseno-marketing-cursos-16955-centrodetalles.htm
            - text: "):"
          - list [ref=e56]:
            - listitem [ref=e57]: "#1 Centro de formación mejor valorado para estudiar diseño en Madrid."
            - listitem [ref=e58]: "#1 Centro de formación mejor valorado para estudiar diseño en Sevilla."
            - listitem [ref=e59]: "#1 Escuela de diseño más demandada de Madrid."
            - listitem [ref=e60]: "#1 Escuela más demandada de España para estudiar programación web."
            - listitem [ref=e61]: "#1 Escuela más demandada de España para estudiar diseño web."
            - listitem [ref=e62]: "#1 Centro de formación profesional mejor valorado de España para estudiar diseño."
            - listitem [ref=e63]: "#1 Escuela mejor valorada de diseño de Madrid."
            - listitem [ref=e64]: "#1 Escuela más demandada para estudiar diseño online."
            - listitem [ref=e65]: "#1 Centro de estudios de postgrado más demandado de Valencia."
            - listitem [ref=e66]: "#1 Escuela más demandada para estudiar Ebusiness en Valencia."
          - heading "El centro" [level=2] [ref=e67]
          - paragraph [ref=e68]:
            - text: CEI -Centro de Estudios de Innovación- fue fundado en 1991 y actualmente es una
            - link "escuela de formación oficial" [ref=e69] [cursor=pointer]:
              - /url: https://cei.es/certificaciones/
            - text: de Adobe, Apple, Autodesk, AWS, Cisco, IBM, Maxon, Microsoft, Oracle, Palo Alto, Unity y Google Partner especializada en el sector de las nuevas tecnologías, diseño y marketing digital con
            - link "sedes" [ref=e71] [cursor=pointer]:
              - /url: https://cei.es/campus/
            - text: en Madrid, Sevilla y Valencia.
          - paragraph [ref=e72]:
            - link "La escuela en .pdf" [ref=e73] [cursor=pointer]:
              - /url: https://cei.es/wp-content/uploads/CEI-Centro-de-Estudios-de-Innovacion.pdf
          - paragraph [ref=e74]: Bonificación para trabajadores
          - paragraph [ref=e75]:
            - text: Si trabajas en alguna empresa puedes
            - link "bonificar hasta el 100% del precio" [ref=e77] [cursor=pointer]:
              - /url: https://cei.es/fundacion-estatal-para-la-formacion-en-el-empleo/
            - text: "de los cursos, bootcamps, masters y títulos superiores de CEI: Centro de Estudios de Innovación, Marketing y Nuevas Tecnologías, gracias a la Fundación Estatal para la Formación en el Empleo. Consulta el saldo de puntos de tu empresa y podrás bonificar una parte o la totalidad de tus estudios. Si quieres, nosotros nos podemos encargar de realizar toda la gestión."
          - paragraph [ref=e78]: Garantía laboral*
          - paragraph [ref=e79]:
            - text: "*Por escrito. Disponemos de un acuerdo de garantía laboral a disposición de los nuevos alumnos de cualquiera de los tres centros: Madrid, Sevilla y Valencia. Más información"
            - link "aquí sobre la garantía laboral" [ref=e81] [cursor=pointer]:
              - /url: https://cei.es/garantia-laboral/
            - text: o en secretaría.
          - heading "Bolsa de trabajo" [level=3] [ref=e82]
          - paragraph [ref=e83]:
            - text: Realiza tus estudios en CEI y, desde el primer día, formarás parte de nuestra
            - link "bolsa de trabajo" [ref=e85] [cursor=pointer]:
              - /url: https://cei.jobteaser.com/
            - text: . Todas nuestras ofertas de empleo son remuneradas. Además, nuestra escuela ha sido galardonada por los Premios Excelencia Educativa por el Mejor Programa Educativo para la Inserción Profesional y Mejor Centro de Formación Profesional.
          - paragraph [ref=e86]: Desde 1991
          - paragraph [ref=e87]:
            - text: Desde 1991
            - link "nuestra escuela" [ref=e89] [cursor=pointer]:
              - /url: https://cei.es/escuela-de-diseno/
            - text: ha formado alumnos para muchos de los sectores que más profesionales demanda el mercado laboral. Durante todo este tiempo lo único que nos hemos marcado como objetivo es la calidad de enseñanza y, hasta la fecha, los casi 30.000alumnos formados que han pasado por nuestra escuela de diseño, marketing y nuevas tecnologías así nos lo confirman.
          - paragraph [ref=e90]: A tu medida
          - paragraph [ref=e91]:
            - text: Además de toda nuestra oferta formativa habitual, ofrecemos la posibilidad de que los alumnos diseñen su propia formación
            - link "a medida" [ref=e93] [cursor=pointer]:
              - /url: https://cei.es/disena-tu-futuro/
            - text: ", eligiendo la duración y el contenido de sus masters seleccionando los módulos de su interés entre los de cualquiera de nuestras áreas formativas."
          - heading "Instalaciones" [level=4] [ref=e94]
          - paragraph [ref=e95]: "Las instalaciones de CEI: Centro de Estudios de Innovación han sido especialmente pensadas para ofrecer un entorno óptimo y adecuado para la impartición de todos nuestros estudios, siendo galardonados por los Premios Excelencia Educativa como Mejor Centro de Formación Presencial."
          - heading "Certificaciones" [level=3] [ref=e96]
          - paragraph [ref=e97]:
            - text: "CEI: Centro de Estudios de Innovación, Marketing y Nuevas Tecnologías es un"
            - link "centro de formación reconocido oficialmente" [ref=e98] [cursor=pointer]:
              - /url: https://cei.es/certificaciones/
            - text: "por el Ministerio de Educación para impartir estudios oficiales de grado superior y homologado por las compañías que lideran el sector de las artes digitales y las nuevas tecnologías: Adobe, Apple, Autodesk, AWS, Cisco, IBM, Maxon, Microsoft, Oracle, Palo Alto, Unity y Google Partner."
          - paragraph [ref=e99]: Sostenibilidad
          - paragraph [ref=e100]:
            - text: "En CEI estamos profundamente comprometidos con la preservación y el cuidado del medio ambiente. Reconocemos la importancia de tomar medidas concretas para contrarrestar el cambio climático y proteger nuestro entorno natural. Por eso, te informamos que en septiembre de 2024 tomamos la decisión de llevar a cabo una iniciativa significativa: plantar un árbol por cada alumno matriculado en nuestra escuela, además de plantar el número de árboles que sean necesarios para compensar las emisiones de CO2 de nuestra página web."
            - link "Puedes echar un vistazo a cómo está creciendo nuestro nuestro bosque aquí." [ref=e101] [cursor=pointer]:
              - /url: https://tree-nation.com/es/perfil/eskool-estudio-creativo-sl
          - paragraph [ref=e102]: Esta iniciativa refleja nuestro firme compromiso con la sostenibilidad y la responsabilidad ambiental. Creemos que cada pequeño esfuerzo cuenta en la lucha por un futuro más verde y saludable para las generaciones venideras. A través de la plantación de árboles, no solo estamos contribuyendo a la mejora de la calidad del aire y la conservación de la biodiversidad, sino que también intentamos concienciar a nuestros estudiantes sobre la importancia de ser guardianes de nuestro planeta.
          - paragraph [ref=e103]: Nuestro compromiso con el medio ambiente va más allá de palabras; es una acción concreta que muestra nuestro compromiso con un futuro más sostenible. Estamos emocionados por esta iniciativa y esperamos que cada árbol plantado represente un recordatorio duradero de la importancia de cuidar y proteger nuestro planeta.
          - paragraph [ref=e104]: Juntos, podemos marcar la diferencia y contribuir a un futuro más verde y próspero para todos.
