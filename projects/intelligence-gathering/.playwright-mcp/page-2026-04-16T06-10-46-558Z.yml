                    - paragraph
                    - generic [ref=e1058]:
                      - generic [ref=e1060]:
                        - paragraph [ref=e1061]: Role Purpose
                        - paragraph [ref=e1062]: The Senior Manager, Creative (Shopper) Spain is responsible for developing, localizing and executing shopper focused content and instore activation assets that bring Coca-Cola brands to life across the retail and away from home landscape.
                        - paragraph [ref=e1063]: This is a new local role, introduced only in Top 9 markets to enhance local relevance, commercial integration, and end to end creative excellence from sell-in to shelf.
                        - paragraph [ref=e1064]: This role ensures that local brand plans translate into breakthrough, insight driven shopper assets, optimized for POS, retail media, grocery multiples, convenience, forecourts, and foodservice outlets.
                        - paragraph [ref=e1065]: Working within the Spain IMX team, this Senior Manager collaborates closely with local brand teams, Commercial, Shopper, RGM, bottler partners, and external agencies to deliver shopper-ready creative that converts demand into purchase, while strengthening brand equity at the point of choice.
                        - paragraph [ref=e1066]: This role is hands-on, executional, and requires a strong understanding of shopper communication principles, design know-how, creative judgment, channel and retail understanding, familiarity of bottlers dynamics and the ability to work autonomously without central support.
                        - paragraph
                        - paragraph [ref=e1067]: What You’ll Do for Us
                        - paragraph [ref=e1068]: Shopper Strategy & Development
                        - list [ref=e1069]:
                          - listitem [ref=e1070]:
                            - paragraph [ref=e1071]: Develop shopper-focused creative ideas and activation concepts that connect brand strategy to retail execution across customers and channels.
                          - listitem [ref=e1072]:
                            - paragraph [ref=e1073]: Translate brand narratives, global creative ideas, and IMX plans into channels specific simple and break-through shopper creative that drives conversion and visibility.
                          - listitem [ref=e1074]:
                            - paragraph [ref=e1075]: Ensure creative solutions reflect shopper insights and principles, category triggers, customer needs, and consumption occasions.
                          - listitem [ref=e1076]:
                            - paragraph [ref=e1077]: Work and collaborate with central Shopper team to scale and deploy best in class shopper toolkits
                        - paragraph
                        - paragraph [ref=e1078]: POS, Retail & Customer Specific Creative
                        - list [ref=e1079]:
                          - listitem [ref=e1080]:
                            - paragraph [ref=e1081]: Lead creation or adaptation of instore and POS assets including shelf strips, gondola ends, wobblers, barkers, display units, digital commerce assets, retail media assets, and promotional material
                          - listitem [ref=e1082]:
                            - paragraph [ref=e1083]: Work with bottlers to localize central shopper material to local realities mastering Coca-Cola Tech tools (like ShopX)
                          - listitem [ref=e1084]:
                            - paragraph [ref=e1085]: Implement local campaigns leveraging 360 integrated activation eco-system, when applicable
                          - listitem [ref=e1086]:
                            - paragraph [ref=e1087]: Adapt master creative assets into contextually relevant, retailers specific executions that respect customer guidelines while maintaining brand integrity.
                          - listitem [ref=e1088]:
                            - paragraph [ref=e1089]: Develop or adapt creative for sell-in materials (customer decks, visuals, mockups, display concepts) working closely with Commercial and Shopper teams.
                        - paragraph
                        - paragraph [ref=e1090]: Cross Functional Collaboration
                        - list [ref=e1091]:
                          - listitem [ref=e1092]:
                            - paragraph [ref=e1093]: Partner with local brand teams to ensure end-to-end integration of creative across brand, shopper, and commercial plans.
                          - listitem [ref=e1094]:
                            - paragraph [ref=e1095]: Work closely with Commercial & Channel, RGM, Shopper Marketing, Insights, and bottler partners to optimize creative impact at point of choice.
                          - listitem [ref=e1096]:
                            - paragraph [ref=e1097]: Ensure creative assets ladder up to IMX and Total Connections plans.
                          - listitem [ref=e1098]:
                            - paragraph [ref=e1099]: Partner and align with central shopper team to ensure local plans are utilising best practice and latest insights
                          - listitem [ref=e1100]:
                            - paragraph [ref=e1101]: Deploy latest shopper tools to streamline and increase efficiencies and speed
                        - paragraph
                        - paragraph [ref=e1102]: Agency & Partner Management
                        - list [ref=e1103]:
                          - listitem [ref=e1104]:
                            - paragraph [ref=e1105]: Manage external creative, design, and production agencies to execute high-quality shopper assets efficiently and on-time.
                          - listitem [ref=e1106]:
                            - paragraph [ref=e1107]: Provide clear briefs, feedback loops, and creative direction to ensure output meets strategic and executional standards.
                          - listitem [ref=e1108]:
                            - paragraph [ref=e1109]: When needed, produce or adapt lightweight creative content using design tools (Illustrator, Photoshop, etc.).
                        - paragraph
                        - paragraph [ref=e1110]: Creative Excellence & Performance
                        - list [ref=e1111]:
                          - listitem [ref=e1112]:
                            - paragraph [ref=e1113]: Ensure all shopper creative adheres to brand guidelines, design systems, VIS, and packaging principles outlined by central OU shopper team
                          - listitem [ref=e1114]:
                            - paragraph [ref=e1115]: Evaluate creative effectiveness through A/B testing, AI testing tools and shopper behavioural studies.
                          - listitem [ref=e1116]:
                            - paragraph [ref=e1117]: Identify opportunities to innovate with new shopper formats, retail technologies, digital signage, and retail media platforms.
                        - paragraph
                        - paragraph [ref=e1118]: Ways of Working & Leadership Behaviours
                        - list [ref=e1119]:
                          - listitem [ref=e1120]:
                            - paragraph [ref=e1121]: Operate independently as a hands-on Shopper expert within the local network model (no central support).
                          - listitem [ref=e1122]:
                            - paragraph [ref=e1123]: Collaborate, share and act as key community member with Central OU Shopper/IMX team
                          - listitem [ref=e1124]:
                            - paragraph [ref=e1125]: Bring curiosity, problems solving, and “startup mindset” to unlock shopper impact with limited budgets.
                          - listitem [ref=e1126]:
                            - paragraph [ref=e1127]: Influence without authority, partnering with cross-functional teams and bottlers to champion creative excellence at shelf.
                        - paragraph
                        - paragraph [ref=e1128]: Qualifications & Requirements
                        - list [ref=e1129]:
                          - listitem [ref=e1130]:
                            - paragraph [ref=e1131]: Associate’s or Bachelor’s degree in Creative Design, Graphic Design, Marketing, Communications, or related field.
                          - listitem [ref=e1132]:
                            - paragraph [ref=e1133]: 5+ years of creative experience in agency or client-side roles with shopper, retail, or POS content development.
                          - listitem [ref=e1134]:
                            - paragraph [ref=e1135]: Demonstrated experience creating shopper, retailer, digital, social, experiential creative assets.
                          - listitem [ref=e1136]:
                            - paragraph [ref=e1137]: Strong conceptual and design skills, with the ability to both ideate and execute.
                          - listitem [ref=e1138]:
                            - paragraph [ref=e1139]: Understanding of print and production guidelines and confidence with Adobe Creative Suite (Illustrator, Photoshop, InDesign)
                          - listitem [ref=e1140]:
                            - paragraph [ref=e1141]: Experience working with agencies, printers, production partners, and cross-functional teams.
                          - listitem [ref=e1142]:
                            - paragraph [ref=e1143]: Strong understanding of bottlers’ dynamics of retail environments, shopper behaviour, and customer specific creative requirements.
                          - listitem [ref=e1144]:
                            - paragraph [ref=e1145]: Excellent collaboration, communication, and stakeholder influencing skills.
                          - listitem [ref=e1146]:
                            - paragraph [ref=e1147]: Ability to manage multiple creative projects simultaneously under tight deadlines.
                          - listitem [ref=e1148]:
                            - paragraph [ref=e1149]: Comfortable working in a fast paced, multicultural, highly networked environment.
                        - paragraph
                        - paragraph [ref=e1150]: What We Can Do for You
                        - list [ref=e1151]:
                          - listitem [ref=e1152]:
                            - paragraph [ref=e1153]: "Shopper Impact: Drive how consumers experience Coca-Cola brands at the most critical moment — the point of purchase."
                          - listitem [ref=e1154]:
                            - paragraph [ref=e1155]: "Creative Playground: Opportunity to experiment with shopper formats, retail innovation, and new creative technologies."
                          - listitem [ref=e1156]:
                            - paragraph [ref=e1157]: "Local Empowerment: Full ownership of GB shopper creative — a new, high visibility capability in a Top 9 market."
                          - listitem [ref=e1158]:
                            - paragraph [ref=e1159]: "Creative Culture: Work alongside best in class brand leaders, agencies, and designers in a creative, innovative environment."
                        - paragraph
