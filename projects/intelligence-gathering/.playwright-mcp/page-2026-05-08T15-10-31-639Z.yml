              - paragraph [ref=e35]:
                - text: El próximo
                - strong [ref=e36]: 12 de junio a las 17:00h
                - text: ", te invitamos a vivir una"
                - strong [ref=e37]: jornada única junto a Atresmedia
                - text: ", el grupo líder de comunicación y medios en España. Durante este evento organizado por The Core School, conocerás de cerca cómo es trabajar en la industria audiovisual a través de una experiencia exclusiva en sus instalaciones."
              - paragraph [ref=e38]: Exploraremos juntos los entresijos del mundo de la televisión y la radio, hablaremos con profesionales que seleccionan talento para sus equipos y descubrirás cómo nuestros másteres especializados, creados en colaboración con Atresmedia, están conectando a nuestros estudiantes con oportunidades laborales reales en el sector. Además, nos acompañarán grandes referentes de los medios de comunicación, que compartirán su experiencia y debatirán sobre la realidad de la industria y cómo abrirse camino en ella. También contaremos con el testimonio de antiguos alumnos que hoy trabajan en Atresmedia tras su paso por The Core.
