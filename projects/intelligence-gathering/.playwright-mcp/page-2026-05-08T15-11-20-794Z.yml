                    - paragraph [ref=e131]: Descripción
                    - paragraph [ref=e132]: "La Encuesta de Población Activa (EPA) es una investigación continua y de periodicidad trimestral dirigida a las familias que viene realizándose desde 1964. Su finalidad principal es obtener datos de la población en relación con el mercado de trabajo: ocupados, activos, parados e inactivos."
                    - paragraph [ref=e133]: La EPA se realiza sobre una muestra de 55.000 familias al trimestre o, lo que es lo mismo, unas 130.000 personas. La primera encuesta que se realiza a cada familia se hace de forma personal por entrevistadores fijos del INE. Las sucesivas encuestas se pueden realizar por teléfono o de forma personal.
                    - paragraph [ref=e134]: El periodo de referencia de la información es la semana anterior a la entrevista. Los resultados de la EPA se obtienen un mes y medio después de finalizar el trabajo de campo.
                    - paragraph [ref=e135]: Revisión de la EPA en 2024
                    - paragraph [ref=e136]: El 19 de abril de 2024 la EPA ha revisado sus estimaciones de los años 2021 a 2023 al incorporar la nueva base de población con información actualizada de los Censos de Población y Viviendas de 2021.
                    - paragraph [ref=e137]
                    - paragraph [ref=e138]: Definiciones de la EPA
                    - paragraph [ref=e139]:
                      - strong [ref=e140]: "Activos:"
                      - text: Son aquellas personas de 16 o más años que, durante la semana de referencia (la anterior a aquella en que se realiza la entrevista), suministran mano de obra para la producción de bienes y servicios o están disponibles y en condiciones de incorporarse a dicha producción. Se subdividen en ocupados y parados.
                    - paragraph [ref=e141]:
                      - strong [ref=e142]: "Ocupados:"
                      - text: Son las personas de 16 o más años que durante la semana de referencia han estado trabajando durante al menos una hora a cambio de una retribución en dinero o especie o quienes teniendo trabajo han estado temporalmente ausentes del mismo por enfermedad, vacaciones, etcétera.
                    - paragraph [ref=e143]: Los ocupados se subdividen en trabajadores por cuenta propia (empleadores, empresarios sin asalariados y trabajadores independientes) y asalariados (públicos o privados). Atendiendo a la duración de la jornada los ocupados se clasifican en ocupados a tiempo completo (con una jornada habitual semanal superior a 30 horas) y a tiempo parcial (con una jornada habitual semanal inferior a 35 horas).
                    - paragraph [ref=e144]:
                      - strong [ref=e145]: "Parados:"
                      - text: "Son las personas de 16 o más años que durante la semana de referencia han estado sin trabajo, disponibles para trabajar y buscando activamente empleo. Se considera que una persona busca empleo de forma activa si:"
                    - list [ref=e146]:
                      - listitem [ref=e147]: Ha estado en contacto con una oficina pública de empleo con el fin de encontrar trabajo.
                      - listitem [ref=e148]: Ha estado en contacto con una oficina privada (oficina de empleo temporal, empresa especializada en contratación, etc.) con el fin de encontrar trabajo.
                      - listitem [ref=e149]: Ha enviado una candidatura directamente a los empleadores.
                      - listitem [ref=e150]: Ha indagado a través de relaciones personales, por mediación de sindicatos, etc.
                      - listitem [ref=e151]: Se ha anunciado o ha respondido a anuncios de periódicos.
                      - listitem [ref=e152]: Ha estudiado ofertas de empleo.
                      - listitem [ref=e153]: Ha participado en una prueba, concurso o entrevista, en el marco de un procedimiento de contratación.
                      - listitem [ref=e154]: Ha estado buscando terrenos o locales.
                      - listitem [ref=e155]: Ha realizado gestiones para obtener permisos, licencias o recursos financieros.
                    - paragraph [ref=e156]: También se consideran parados a las personas que ya han encontrado un trabajo y están a la espera de incorporarse a él, siempre que verifiquen las dos primeras condiciones.
                    - paragraph [ref=e157]:
                      - strong [ref=e158]: "Inactivos:"
                      - text: Recibe esta consideración la población de 16 o más años no incluida en las categorías anteriores.
