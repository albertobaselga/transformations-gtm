        - listitem [ref=e103]: "Editor/a y Postproductor/a de Vídeo: profesional centrado en edición audiovisual, postproducción, montaje, corrección visual, integración de VFX y optimización de flujos de trabajo con herramientas de IA aplicadas al vídeo."
        - listitem [ref=e104]: "Content Creator Visual: creador/a de contenido especializado en producción de piezas visuales, vídeo, imagen y formatos creativos para medios digitales, redes sociales, campañas online y estrategias de comunicación de marca."
