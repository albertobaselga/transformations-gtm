        - /url: https://cei.es/centro-formacion/
        - heading "Fórmate en la escuela líder en España:" [level=3] [ref=e94]
      - paragraph [ref=e95]: Somos el centro de formación con mayor número de estudiantes de España de nuestro sector, pasando por nuestras aulas aproximadamente 4.000 alumnos cada año, apasionados por el mundo del diseño, el marketing y las tecnologías emergentes. Ser la opción más elegida del país, junto a nuestra trayectoria de más de 30 años como escuela, es la máxima garantía de calidad que podemos ofrecer a cualquier interesado en estudiar en CEI.
    - generic [ref=e96]:
