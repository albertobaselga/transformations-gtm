        - listitem [ref=e101]: "Diseñador/a Gráfico/a con IA: perfil orientado a la creación de identidades visuales, piezas gráficas, composiciones editoriales y recursos de comunicación visual utilizando Adobe Creative Cloud e inteligencia artificial generativa."
