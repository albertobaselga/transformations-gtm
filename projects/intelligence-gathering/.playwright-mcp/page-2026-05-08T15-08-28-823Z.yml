        - generic [ref=e68]:
          - heading [level=4]
    - generic [ref=e69]:
      - heading "Contenido del Global Master in AI & Visual Creativity" [level=2] [ref=e70]
      - generic [ref=e71]:
        - paragraph [ref=e72]: El Máster en IA & Visual Creativity está diseñado para formar profesionales capaces de unir creatividad, diseño, narrativa visual e inteligencia artificial dentro de un mismo perfil. A lo largo del programa trabajarás las áreas clave del diseño gráfico, la producción gráfica, la dirección de arte, la edición y postproducción de vídeo, el motion graphics y la automatización con IA, desarrollando una visión transversal del proceso creativo contemporáneo.
        - paragraph [ref=e73]: Durante una primera fase del máster profundizarás en diseño gráfico y comunicación visual con herramientas de Adobe como Illustrator, Photoshop e InDesign, abordando identidad visual, composición, tipografía, imagen digital, creatividad aplicada, branding, packaging, maquetación y producción gráfica. Esta base te permitirá construir proyectos visuales sólidos, entender los fundamentos del lenguaje gráfico y desarrollar piezas adaptadas a distintos soportes y objetivos de comunicación.
        - paragraph [ref=e74]: En una segunda fase, el programa se centra en la dirección de arte y la producción audiovisual, trabajando la conceptualización creativa, el pensamiento visual, la construcción de universos de marca y la ejecución de proyectos en vídeo. Aprenderás a editar y postproducir piezas con Adobe Premiere, a crear composiciones, VFX y motion graphics con Adobe After Effects, y a integrar recursos visuales y narrativos en campañas, contenidos digitales y piezas audiovisuales de nivel profesional.
        - paragraph [ref=e75]: Además, el máster incorpora una especialización en inteligencia artificial aplicada a la creatividad visual, donde trabajarás fundamentos de IA, LLMs, prompting, asistentes, automatizaciones no-code, agentes inteligentes, generación de imagen y vídeo, marketing con IA y vibe coding. El objetivo es que aprendas a utilizar la inteligencia artificial no solo como herramienta de apoyo, sino como parte activa de tus procesos de ideación, producción, optimización y experimentación creativa.
        - paragraph [ref=e76]: Gracias a este enfoque, el alumno no solo aprende a diseñar, dirigir y producir proyectos visuales, sino también a construir flujos de trabajo creativos asistidos por IA, cada vez más demandados en estudios, agencias, productoras, departamentos de marketing y entornos digitales. El programa culmina con un proyecto final orientado a portfolio, pensado para integrar los conocimientos adquiridos en diseño, audiovisual, dirección de arte e inteligencia artificial aplicada.
