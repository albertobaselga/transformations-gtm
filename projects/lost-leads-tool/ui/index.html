<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost Leads — 35mm.es Inteligencia de No-Compra</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; }
  .header { background: #1a56db; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .stats { font-size: 13px; opacity: 0.85; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
  .tabs { display: flex; gap: 2px; margin-bottom: 20px; }
  .tab { padding: 10px 20px; background: white; border: 1px solid #ddd; cursor: pointer; font-size: 13px; font-weight: 500; }
  .tab:first-child { border-radius: 6px 0 0 6px; }
  .tab:last-child { border-radius: 0 6px 6px 0; }
  .tab.active { background: #1a56db; color: white; border-color: #1a56db; }
  .panel { display: none; }
  .panel.active { display: block; }
  .form-card { background: white; border-radius: 8px; border: 1px solid #e0e0e0; padding: 24px; margin-bottom: 20px; }
  .form-card h2 { font-size: 16px; margin-bottom: 16px; color: #333; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group input, .form-group select, .form-group textarea { padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
  .form-group textarea { min-height: 80px; resize: vertical; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #1a56db; outline: none; box-shadow: 0 0 0 2px rgba(26,86,219,0.1); }
  .btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn-primary { background: #1a56db; color: white; }
  .btn-primary:hover { background: #1545b5; }
  .btn-danger { background: #dc2626; color: white; font-size: 11px; padding: 4px 8px; }
  .btn-secondary { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
  .form-actions { margin-top: 16px; display: flex; gap: 8px; }
  .table-card { background: white; border-radius: 8px; border: 1px solid #e0e0e0; overflow: hidden; }
  .table-header { padding: 16px 20px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
  .table-header h2 { font-size: 16px; }
  .filters { display: flex; gap: 8px; align-items: center; }
  .filters select { padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f9fafb; padding: 10px 12px; text-align: left; font-weight: 600; color: #555; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; border-bottom: 1px solid #e0e0e0; }
  td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
  tr:hover { background: #f9fafb; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .badge-precio { background: #fef2f2; color: #991b1b; }
  .badge-contenido { background: #fffbeb; color: #92400e; }
  .badge-competidor { background: #eff6ff; color: #1e40af; }
  .badge-timing { background: #f0fdf4; color: #166534; }
  .badge-formato { background: #faf5ff; color: #6b21a8; }
  .badge-otro { background: #f3f4f6; color: #374151; }
  .badge-processed { background: #f0fdf4; color: #166534; }
  .badge-pending { background: #fffbeb; color: #92400e; }
  .clickable { cursor: pointer; color: #1a56db; text-decoration: underline; }
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .stat-card { background: white; border-radius: 8px; border: 1px solid #e0e0e0; padding: 16px; text-align: center; }
  .stat-value { font-size: 28px; font-weight: 700; color: #1a56db; }
  .stat-label { font-size: 12px; color: #666; margin-top: 4px; }
  .chart-section { background: white; border-radius: 8px; border: 1px solid #e0e0e0; padding: 20px; margin-bottom: 14px; }
  .chart-section h3 { font-size: 14px; margin-bottom: 12px; color: #333; }
  .bar-chart { display: flex; flex-direction: column; gap: 6px; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-label { width: 120px; font-size: 12px; color: #555; text-align: right; }
  .bar-fill { height: 20px; background: #1a56db; border-radius: 3px; min-width: 2px; }
  .bar-count { font-size: 12px; color: #666; min-width: 30px; }
  .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; background: #166534; color: white; border-radius: 6px; font-size: 14px; display: none; z-index: 100; }
  .toast.error { background: #991b1b; }
</style>
</head>
<body>

<div class="header">
  <h1>Lost Leads — 35mm.es</h1>
  <div class="stats" id="headerStats">Cargando...</div>
</div>

<div class="container">
  <div class="tabs">
    <div class="tab active" data-tab="list">Leads</div>
    <div class="tab" data-tab="add">Nuevo Lead</div>
    <div class="tab" data-tab="stats">Estadisticas</div>
  </div>

  <div class="panel active" id="panel-list">
    <div class="table-card">
      <div class="table-header">
        <h2>Leads no convertidos</h2>
        <div class="filters">
          <select id="filterReason"><option value="">Todos los motivos</option><option value="precio">Precio</option><option value="contenido">Contenido</option><option value="competidor">Competidor</option><option value="timing">Timing</option><option value="formato">Formato</option><option value="otro">Otro</option></select>
          <select id="filterCategory"><option value="">Todas las categorias</option><option value="cine">Cine</option><option value="animacion">Animacion</option><option value="videojuegos">Videojuegos</option><option value="sonido">Sonido</option><option value="fotografia">Fotografia</option><option value="tv">TV</option><option value="produccion">Produccion</option><option value="otro">Otro</option></select>
          <select id="filterProcessed"><option value="">Todos</option><option value="true">Sin procesar</option></select>
        </div>
      </div>
      <table>
        <thead><tr><th>Fecha</th><th>Nombre</th><th>Curso</th><th>Categoria</th><th>Motivo</th><th>Competidor</th><th>Precio</th><th>Estado</th><th></th></tr></thead>
        <tbody id="leadsTable"></tbody>
      </table>
    </div>
  </div>

  <div class="panel" id="panel-add">
    <div class="form-card">
      <h2 id="formTitle">Registrar nuevo lead no convertido</h2>
      <form id="leadForm">
        <input type="hidden" id="editId" value="">
        <div class="form-grid">
          <div class="form-group"><label>Nombre del lead *</label><input type="text" id="lead_name" required></div>
          <div class="form-group"><label>Fecha de contacto *</label><input type="date" id="contact_date" required></div>
          <div class="form-group"><label>Email</label><input type="email" id="lead_email"></div>
          <div class="form-group"><label>Telefono</label><input type="tel" id="lead_phone"></div>
          <div class="form-group"><label>Curso interesado *</label><input type="text" id="course_interested" required placeholder="Ej: Master en VFX y Animacion 3D"></div>
          <div class="form-group"><label>Categoria *</label><select id="course_category" required><option value="">Seleccionar...</option><option value="cine">Cine</option><option value="animacion">Animacion y VFX</option><option value="videojuegos">Videojuegos</option><option value="sonido">Sonido</option><option value="fotografia">Fotografia</option><option value="tv">TV</option><option value="produccion">Produccion</option><option value="otro">Otro</option></select></div>
          <div class="form-group"><label>Motivo de no compra *</label><select id="non_purchase_reason" required><option value="">Seleccionar...</option><option value="precio">Precio</option><option value="contenido">Contenido no encaja</option><option value="competidor">Eligio competidor</option><option value="timing">Timing / No es el momento</option><option value="formato">Formato no adecuado</option><option value="otro">Otro</option></select></div>
          <div class="form-group"><label>Sensibilidad al precio</label><select id="price_sensitivity"><option value="">No determinada</option><option value="low">Baja</option><option value="medium">Media</option><option value="high">Alta</option></select></div>
          <div class="form-group"><label>Competidor elegido</label><input type="text" id="competitor_chosen" placeholder="Ej: Domestika, CEI..."></div>
          <div class="form-group"><label>Detalle del motivo</label><input type="text" id="non_purchase_detail" placeholder="Detalle adicional"></div>
          <div class="form-group full"><label>Transcripcion de comunicaciones</label><textarea id="transcription" placeholder="Pegar aqui la transcripcion..."></textarea></div>
          <div class="form-group full"><label>Notas del closer</label><textarea id="closer_notes" placeholder="Notas de la persona que cerro la oportunidad..."></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Guardar lead</button>
          <button type="button" class="btn btn-secondary" id="resetBtn">Limpiar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="panel" id="panel-stats">
    <div class="stats-grid" id="statsCards"></div>
    <div id="statsCharts"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;
const FIELDS = ['lead_name','lead_email','lead_phone','course_interested','course_category','contact_date','transcription','closer_notes','non_purchase_reason','non_purchase_detail','competitor_chosen','price_sensitivity'];

// --- DOM helpers using safe methods ---
function el(id) { return document.getElementById(id); }
function clearChildren(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function createEl(tag, attrs, text) {
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => { if (k === 'className') e.className = v; else e.setAttribute(k, v); });
  if (text) e.textContent = text;
  return e;
}

// --- Tabs ---
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', function() {
    const t = this.dataset.tab;
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    this.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    el('panel-' + t).classList.add('active');
    if (t === 'list') loadLeads();
    if (t === 'stats') loadStats();
  });
});

function showToast(msg, error) {
  const t = el('toast');
  t.textContent = msg;
  t.className = 'toast' + (error ? ' error' : '');
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 3000);
}

function switchTab(name) {
  document.querySelector('.tab[data-tab="' + name + '"]').click();
}

// --- Leads list ---
function buildRow(lead) {
  const tr = createEl('tr');
  tr.appendChild(createEl('td', {}, lead.contact_date));
  const nameTd = createEl('td', { className: 'clickable' }, lead.lead_name);
  nameTd.addEventListener('click', function() { editLead(lead.id); });
  tr.appendChild(nameTd);
  tr.appendChild(createEl('td', {}, lead.course_interested));
  tr.appendChild(createEl('td', {}, lead.course_category));
  const reasonTd = createEl('td');
  reasonTd.appendChild(createEl('span', { className: 'badge badge-' + lead.non_purchase_reason }, lead.non_purchase_reason));
  tr.appendChild(reasonTd);
  tr.appendChild(createEl('td', {}, lead.competitor_chosen || '\u2014'));
  tr.appendChild(createEl('td', {}, lead.price_sensitivity || '\u2014'));
  const statusTd = createEl('td');
  statusTd.appendChild(createEl('span', { className: 'badge ' + (lead.processed_by_agent ? 'badge-processed' : 'badge-pending') }, lead.processed_by_agent ? 'Procesado' : 'Pendiente'));
  tr.appendChild(statusTd);
  const actionTd = createEl('td');
  const delBtn = createEl('button', { className: 'btn btn-danger' }, 'Eliminar');
  delBtn.addEventListener('click', function() { deleteLead(lead.id); });
  actionTd.appendChild(delBtn);
  tr.appendChild(actionTd);
  return tr;
}

async function loadLeads() {
  const params = new URLSearchParams();
  var v = el('filterReason').value; if (v) params.set('reason', v);
  v = el('filterCategory').value; if (v) params.set('category', v);
  v = el('filterProcessed').value; if (v) params.set('unprocessed', v);
  const res = await fetch(API + '/api/leads?' + params);
  const leads = await res.json();
  const tbody = el('leadsTable');
  clearChildren(tbody);
  leads.forEach(function(lead) { tbody.appendChild(buildRow(lead)); });
}

// --- Form ---
el('leadForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const body = {};
  FIELDS.forEach(function(f) { body[f] = el(f).value || null; });
  const editId = el('editId').value;
  const method = editId ? 'PUT' : 'POST';
  const url = editId ? API + '/api/leads/' + editId : API + '/api/leads';
  const res = await fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (res.ok) {
    showToast(editId ? 'Lead actualizado' : 'Lead registrado');
    resetForm();
    switchTab('list');
  } else {
    const err = await res.json();
    showToast(err.error || 'Error al guardar', true);
  }
});

async function editLead(id) {
  const res = await fetch(API + '/api/leads/' + id);
  const lead = await res.json();
  el('editId').value = lead.id;
  el('formTitle').textContent = 'Editar lead #' + lead.id;
  el('submitBtn').textContent = 'Actualizar lead';
  FIELDS.forEach(function(f) { el(f).value = lead[f] || ''; });
  switchTab('add');
}

async function deleteLead(id) {
  if (!confirm('Eliminar este lead?')) return;
  await fetch(API + '/api/leads/' + id, { method: 'DELETE' });
  showToast('Lead eliminado');
  loadLeads();
}

function resetForm() {
  el('leadForm').reset();
  el('editId').value = '';
  el('formTitle').textContent = 'Registrar nuevo lead no convertido';
  el('submitBtn').textContent = 'Guardar lead';
}
el('resetBtn').addEventListener('click', resetForm);

// --- Stats (using safe DOM methods) ---
function buildStatCard(value, label) {
  const card = createEl('div', { className: 'stat-card' });
  card.appendChild(createEl('div', { className: 'stat-value' }, String(value)));
  card.appendChild(createEl('div', { className: 'stat-label' }, label));
  return card;
}

function buildChart(title, data, labelKey) {
  var maxCount = 1;
  data.forEach(function(r) { if (r.count > maxCount) maxCount = r.count; });
  var section = createEl('div', { className: 'chart-section' });
  section.appendChild(createEl('h3', {}, title));
  var chart = createEl('div', { className: 'bar-chart' });
  data.forEach(function(r) {
    var row = createEl('div', { className: 'bar-row' });
    row.appendChild(createEl('div', { className: 'bar-label' }, r[labelKey]));
    var fill = createEl('div', { className: 'bar-fill' });
    fill.style.width = (r.count / maxCount * 100) + '%';
    row.appendChild(fill);
    row.appendChild(createEl('div', { className: 'bar-count' }, String(r.count)));
    chart.appendChild(row);
  });
  section.appendChild(chart);
  return section;
}

async function loadStats() {
  var res = await fetch(API + '/api/stats');
  var stats = await res.json();
  var cards = el('statsCards');
  clearChildren(cards);
  cards.appendChild(buildStatCard(stats.total, 'Total leads'));
  cards.appendChild(buildStatCard(stats.unprocessed, 'Sin procesar'));
  cards.appendChild(buildStatCard(stats.recentWeek, 'Ultima semana'));
  var pct = stats.total > 0 ? Math.round((stats.total - stats.unprocessed) / stats.total * 100) : 0;
  cards.appendChild(buildStatCard(pct + '%', 'Procesados'));
  var charts = el('statsCharts');
  clearChildren(charts);
  charts.appendChild(buildChart('Por motivo de no compra', stats.byReason, 'non_purchase_reason'));
  charts.appendChild(buildChart('Por categoria de curso', stats.byCategory, 'course_category'));
  charts.appendChild(buildChart('Competidores elegidos', stats.byCompetitor, 'competitor_chosen'));
  charts.appendChild(buildChart('Sensibilidad al precio', stats.bySensitivity, 'price_sensitivity'));
}

async function loadHeaderStats() {
  try {
    var res = await fetch(API + '/api/stats');
    var stats = await res.json();
    el('headerStats').textContent = stats.total + ' leads | ' + stats.unprocessed + ' sin procesar | ' + stats.recentWeek + ' esta semana';
  } catch(e) {
    el('headerStats').textContent = 'Sin conexion a la API';
  }
}

// --- Filters ---
el('filterReason').addEventListener('change', loadLeads);
el('filterCategory').addEventListener('change', loadLeads);
el('filterProcessed').addEventListener('change', loadLeads);

// --- Init ---
el('contact_date').valueAsDate = new Date();
loadLeads();
loadHeaderStats();
</script>
</body>
</html>
