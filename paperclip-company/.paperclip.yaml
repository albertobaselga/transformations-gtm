routines:
  daily-intelligence-gathering:
    title: "Recoleccion Diaria de Inteligencia"
    description: "Cada analista investiga su fuente asignada y produce una nota diaria de hallazgos"
    assignee: head-marcos
    project: intelligence-gathering
    priority: medium
    triggers:
      - kind: schedule
        cronExpression: "0 8 * * 1-5"
        timezone: Europe/Madrid
  weekly-synthesis:
    title: "Sintesis Semanal de Oportunidades"
    description: "El CEO lidera la sintesis de senales en clusters de oportunidades con validacion cruzada"
    assignee: ceo-elena
    project: opportunity-synthesis
    priority: high
    triggers:
      - kind: schedule
        cronExpression: "0 10 * * 5"
        timezone: Europe/Madrid
  weekly-report-publication:
    title: "Publicacion del Informe Semanal"
    description: "Consolidar la sintesis en el informe semanal publicado"
    assignee: ceo-elena
    project: weekly-report
    priority: high
    triggers:
      - kind: schedule
        cronExpression: "0 14 * * 5"
        timezone: Europe/Madrid
  daily-lost-leads-extraction:
    title: "Extraccion Diaria de Lost Leads"
    description: "Extraer nuevos registros de la BD de Lost Leads y actualizar analisis de patrones"
    assignee: analyst-lost-leads
    project: intelligence-gathering
    priority: medium
    triggers:
      - kind: schedule
        cronExpression: "0 9 * * 1-5"
        timezone: Europe/Madrid
